buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// @react-native-voice/voice still pulls com.android.support — map to AndroidX (no jetifier).
subprojects { subproject ->
    subproject.configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute(module('com.android.support:appcompat-v7'))
                .using(module('androidx.appcompat:appcompat:1.7.0'))
                .because('AndroidX-only project')
            substitute(module('com.android.support:support-compat'))
                .using(module('androidx.core:core:1.13.1'))
                .because('AndroidX-only project')
            substitute(module('com.android.support:support-v4'))
                .using(module('androidx.legacy:legacy-support-v4:1.0.0'))
                .because('AndroidX-only project')
            substitute(module('com.android.support:animated-vector-drawable'))
                .using(module('androidx.vectordrawable:vectordrawable-animated:1.2.0'))
                .because('AndroidX-only project')
            substitute(module('com.android.support:support-vector-drawable'))
                .using(module('androidx.vectordrawable:vectordrawable:1.2.0'))
                .because('AndroidX-only project')
            substitute(module('com.android.support:versionedparcelable'))
                .using(module('androidx.versionedparcelable:versionedparcelable:1.1.1'))
                .because('AndroidX-only project')
        }
    }
}
